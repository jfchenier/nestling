# Portainer stack (Stacks -> Add stack -> Web editor) for nestling.example.com.
# Nginx Proxy Manager forwards https://nestling.example.com to http://<server>:8383.
services:
  nestling:
    image: ghcr.io/jfchenier/nestling:latest
    container_name: nestling
    restart: unless-stopped
    ports:
      - "8383:8080"
    volumes:
      - nestling-data:/data
    environment:
      # Set to "false" once you and your caregivers have created accounts, then redeploy.
      NESTLING_OPEN_REGISTRATION: "true"
      RUST_LOG: "nestling=info,tower_http=info"

volumes:
  nestling-data:
