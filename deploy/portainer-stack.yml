# Portainer stack (Stacks -> Add stack -> Web editor) for nestling.example.com.
# Works as a Swarm stack or a plain Compose stack.
# Nginx Proxy Manager forwards https://nestling.example.com to http://<server>:8383.
# Set NESTLING_IMAGE under the stack's "Environment variables", e.g. ghcr.io/<owner>/nestling:latest.
services:
  nestling:
    image: ${NESTLING_IMAGE}
    ports:
      - "8383:8080"
    volumes:
      - nestling-data:/data
    environment:
      RUST_LOG: "nestling=info,tower_http=info"
      # Notifications on phones (optional, see README "Notifications on phones"):
      # NESTLING_FCM_CREDENTIALS: /data/firebase.json
      # NESTLING_FCM_APP_ID: "1:000000000000:android:0000000000000000"
      # NESTLING_FCM_API_KEY: "..."
    restart: unless-stopped # plain Compose
    deploy: # Swarm
      restart_policy:
        condition: any

volumes:
  nestling-data:
