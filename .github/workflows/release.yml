# Builds the Android APK (and the web app) and publishes them as a GitHub Release.
#
# Release: push a tag like `v0.2.0`  ->  Release "Nestling 0.2.0" with the APK attached.
# Or a manual run (Actions tab -> Release -> Run workflow) with "version" set (e.g. 0.2.0): same
# release, and the workflow creates the v0.2.0 tag on the commit it built.
# Manual run without a version: builds and uploads the APK as a workflow artifact only.
#
# Signing: set these repository secrets (Settings -> Secrets and variables -> Actions) so
# every release is signed with the same key and installs as an update over the previous one:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks keystore
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. "upload")
#   ANDROID_KEY_PASSWORD      key password
# Without them the APK is signed with a throwaway debug key (fine for testing, but each build
# then has a different signature and Android refuses to update one with another).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version (e.g. 0.2.0; creates the v0.2.0 tag). Empty: build only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    name: Android APK + web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Nestling $VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key and can't update a previous install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter pub get
      - run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${GITHUB_RUN_NUMBER}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/nestling-${{ steps.version.outputs.version }}.apk"

      - name: Build web app
        run: |
          flutter build web --release --no-web-resources-cdn
          sh tool/finish_web_build.sh
          (cd build/web && zip -qr "../../../dist/nestling-web-${{ steps.version.outputs.version }}.zip" .)

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nestling-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          name: Nestling ${{ steps.version.outputs.version }}
          # A manual release creates the tag on the commit that was built.
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
