# Builds the server image (Rust server + Flutter web app) and publishes it to GitHub's
# container registry: ghcr.io/jfchenier/nestling
#   :latest and :main   every push to main
#   :0.2.0, :0.2        tags v0.2.0
#   :sha-<commit>       every build
#   :main-YYYY-MM-DD    the weekly rebuild (also moves :latest and :main)
# The weekly rebuild (Monday 04:00 UTC) builds main again from the newest base images, with
# the runtime stage's Debian packages upgraded, so security fixes land without a code change.
# It only publishes the image; nothing is redeployed.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=main-${{ steps.date.outputs.date }},enable=${{ github.event_name == 'schedule' }}

      # The version Settings → About shows: 0.2.0 for tag v0.2.0, else <branch>-<commit>.
      - id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: NESTLING_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64
          # Weekly rebuild: fetch the newest base images and redo the runtime stage, so its
          # apt-get upgrade runs again instead of coming from cache.
          pull: true
          no-cache-filters: ${{ github.event_name == 'schedule' && 'runtime' || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
