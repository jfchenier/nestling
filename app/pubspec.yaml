name: nestling
description: "Nestling — baby tracker for the self-hosted Nestling server (web + Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.20.1
  fl_chart: ^1.2.0
  provider: ^6.1.2
  web: ^1.1.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  image: ^4.10.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
